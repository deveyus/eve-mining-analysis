[project]
name = "eve-mining-analysis"
version = "0.1.0"
description = "EVE Online mining fleet economics: payback, efficiency, and MSI impact analysis"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.scripts]
eve-mining = "eve_mining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
